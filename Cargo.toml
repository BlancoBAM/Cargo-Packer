[package]
name = "cargo-packer-v2"
version = "1.0.0"
edition = "2021"
description = "Save crates.io pages to local Cargo.toml files"
license = "MIT"
repository = "https://github.com/BlancoBAM/Cargo-Packer"

[lib]
crate-type = ["cdylib"]

[dependencies]
oxichrome = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", features = ["serde"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "console", "Url", "Blob", "UrlSearchParams", "MessageEvent", "BlobPropertyBag", "WorkerGlobalScope", "FileSystemHandle", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemWritableFileStream", "Request", "RequestInit", "RequestMode", "Headers", "Response"] }
js-sys = "0.3"
leptos = "0.8"
gloo-timers = "0.2"
gloo-net = "0.1"
regex = "1"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1